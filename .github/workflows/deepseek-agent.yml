name: DeepSeek RE Agent (on demand)

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: 32-character job ID generated by the PHP panel
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deepseek-job-${{ inputs.job_id }}
  cancel-in-progress: false

jobs:
  deepseek-agent:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      PANEL_BASE_URL: ${{ secrets.PANEL_BASE_URL }}
      WORKER_KEY: ${{ secrets.WORKER_KEY }}
      MODEL_HF: mradermacher/DeepSeek-R1-Distill-Qwen-1.5B-abliterated-GGUF:Q4_K_M
      JOB_ID: ${{ inputs.job_id }}
      ENABLE_GHIDRA: ${{ vars.ENABLE_GHIDRA || 'false' }}
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Checkout worker
        uses: actions/checkout@v4
      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Setup Java for JADX and optional Ghidra
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Install binary analysis dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends binutils file unzip curl git cmake g++ pkg-config libssl-dev libcurl4-openssl-dev apktool
          python -m pip install -r github/worker/requirements.txt
          bash github/scripts/install-jadx.sh
      - name: Install Ghidra headless (optional)
        if: env.ENABLE_GHIDRA == 'true'
        run: bash github/scripts/install-ghidra.sh
      - name: Cache Hugging Face model (optional, consumes Actions cache quota)
        if: vars.CACHE_MODEL == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface/hub
          key: deepseek-r1-1p5b-abliterated-q4km-2026
      - name: Compile llama.cpp CPU backend
        run: |
          git clone --depth=1 https://github.com/ggml-org/llama.cpp.git /tmp/llama.cpp
          cmake -S /tmp/llama.cpp -B /tmp/llama.cpp/build -DCMAKE_BUILD_TYPE=Release -DGGML_CUDA=OFF -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_EXAMPLES=OFF -DLLAMA_BUILD_SERVER=ON -DLLAMA_OPENSSL=ON
          cmake --build /tmp/llama.cpp/build --target llama-server --parallel 4
          test -x /tmp/llama.cpp/build/bin/llama-server
      - name: Analyze and run DeepSeek
        run: python github/worker/worker.py
      - name: Save local artifact for recovery
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deepseek-job-${{ inputs.job_id }}
          path: output/
          if-no-files-found: ignore
          retention-days: 7
